name: Release
on:
  push:
    branches:
      - main
      - develop
      - alpha
      - beta

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 自动发布默认暂停：npm 凭据失效时避免每次 push 都产生失败的 run。
    # 恢复步骤：1) 配置有效的 npm 凭据（更新 NPM_TOKEN secret，或改用 OIDC trusted publishing）
    #          2) 在仓库 Settings → Secrets and variables → Actions → Variables
    #             新增 ENABLE_NPM_RELEASE = true
    if: "vars.ENABLE_NPM_RELEASE == 'true' && !contains(github.event.head_commit.message, 'skip ci')"
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js with OIDC
        uses: actions/setup-node@v4
        with:
          node-version: '20.8.1'
          registry-url: 'https://registry.npmjs.org/'
          scope: '@'

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release